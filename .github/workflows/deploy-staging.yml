name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta tag (e.g. v0.1.0-beta.2)'
        required: true
        type: string

permissions: {}

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Same-job Release Assets upload avoids temporary Actions artifact storage.
      attestations: read # gh release verify and verify-asset require attestation access in private repositories.
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      BETA_TAG: ${{ inputs.version }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate staging release inputs and CLI support
        shell: bash
        run: |
          bash scripts/validate-staging-release.sh
          gh release verify --help > /dev/null
          gh release verify-asset --help > /dev/null
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run format:check
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Build staging assets
        run: bun run build:staging
      - name: Verify staging assets in local Pages runtime
        run: bun run verify:staging:local
      - name: Deploy staging static assets
        shell: bash
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Register the staging Environment secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Register the staging Environment secret}"
          bunx wrangler pages deploy dist \
            --project-name=gakumas-produce-memory-deck-staging \
            --branch=main \
            --commit-hash="$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed staging site
        run: bun run test:staging
      - name: Record deployment
        shell: bash
        run: |
          printf '## Staging\n\n- URL: %s\n- Commit: %s\n- Beta: %s\n' \
            "$STAGING_URL" "$GITHUB_SHA" "$BETA_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish immutable beta with verified assets
        run: python3 scripts/publish_staging_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
